<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=5.0,
user-scalable=yes">

<title>🌻 Galaxia de Flores Amarillas</title>

<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* =========================
   INTRO
========================= */

#intro{

    position:fixed;
    inset:0;

    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
    radial-gradient(
        circle at center,
        #54206f 0%,
        #180626 45%,
        #020006 100%
    );

    transition:opacity 1s;
}

.introBox{

    width:90%;
    max-width:600px;

    color:white;
}

.bigFlower{

    font-size:100px;

    animation:
    float 3s ease-in-out infinite,
    glow 2s infinite alternate;
}

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-18px);
    }
}

@keyframes glow{

    from{
        filter:drop-shadow(0 0 5px gold);
    }

    to{
        filter:drop-shadow(0 0 40px #ffd000);
    }
}

.introBox h1{

    margin-top:20px;

    color:#ffe66b;

    font-size:clamp(
        30px,
        8vw,
        55px
    );
